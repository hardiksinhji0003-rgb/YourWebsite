    <!-- Prevent theme and language font flash before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gujaratorna_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var savedLang = localStorage.getItem('gujaratorna_language');
          if (savedLang === 'gu' || savedLang === 'hi' || savedLang === 'en') {
            document.documentElement.lang = savedLang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
